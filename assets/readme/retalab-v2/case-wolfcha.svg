<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Wolfcha README concept: make a tabletop experience tangible</title><desc id="desc">A moonlit tabletop layout illustrates player seats, a central game-master token, and a clear visual entry point.</desc><defs><radialGradient id="moon"><stop stop-color="#64699B"/><stop offset="1" stop-color="#1B1E36"/></radialGradient></defs><rect width="1200" height="520" rx="26" fill="#15192B"/><circle cx="901" cy="270" r="224" fill="url(#moon)" opacity=".78"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><text x="54" y="52" fill="#C2C8F4" font-size="14" font-weight="750" letter-spacing="2">GAME / TABLETOP EXPERIENCE</text><text x="54" y="112" fill="#F5F0E5" font-size="44" font-weight="780">Let the table tell you how to play.</text><text x="54" y="148" fill="#B9BED3" font-size="17">A conceptual scene makes roles and turn-taking visible.</text><ellipse cx="882" cy="311" rx="222" ry="128" fill="#262941" stroke="#9AA1D0" stroke-opacity=".72" stroke-width="3"/><ellipse cx="882" cy="311" rx="171" ry="88" fill="#343955" stroke="#5D658A" stroke-width="2"/><circle cx="882" cy="311" r="45" fill="#E7C982"/><path d="M861 322c2-22 8-33 21-35 14 2 21 14 22 35z" fill="#302B38"/><path d="M869 291l13-17 13 17-5 8h-16z" fill="#F3E9CE"/><text x="882" y="378" text-anchor="middle" fill="#DADDF0" font-size="13" font-weight="700" letter-spacing="1">GAME MASTER</text><g fill="#E5E8F4" stroke="#7C86B2" stroke-width="2"><circle cx="710" cy="263" r="24"/><circle cx="760" cy="385" r="24"/><circle cx="882" cy="420" r="24"/><circle cx="1004" cy="385" r="24"/><circle cx="1054" cy="263" r="24"/><circle cx="882" cy="202" r="24"/></g><g fill="#2D3550"><circle cx="710" cy="263" r="8"/><circle cx="760" cy="385" r="8"/><circle cx="882" cy="420" r="8"/><circle cx="1004" cy="385" r="8"/><circle cx="1054" cy="263" r="8"/><circle cx="882" cy="202" r="8"/></g><g fill="none" stroke="#FF8C74" stroke-width="2" stroke-dasharray="4 6"><path d="M734 269l105 27M780 377l67-47M902 330l84 47M925 296l105-27M882 226v39"/></g><rect x="66" y="226" width="283" height="174" rx="15" fill="#20253B" stroke="#444C6B"/><text x="89" y="260" fill="#AEB8D9" font-size="13" font-weight="750" letter-spacing="1.3">ROUND FLOW</text><g font-size="15" font-weight="700"><rect x="89" y="279" width="237" height="29" rx="7" fill="#343B59"/><text x="103" y="299" fill="#F5F0E5">01  Gather at the table</text><rect x="89" y="317" width="237" height="29" rx="7" fill="#343B59"/><text x="103" y="337" fill="#F5F0E5">02  Receive a hidden role</text><rect x="89" y="355" width="237" height="29" rx="7" fill="#343B59"/><text x="103" y="375" fill="#F5F0E5">03  Play the round</text></g><text x="54" y="470" fill="#868EAF" font-family="ui-monospace,monospace" font-size="13">PROJECT-NATIVE ILLUSTRATION · VECTOR ART</text></g></svg>
