<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">From buried details to a clear first read</title><desc id="desc">A dense repository page becomes a story that leads with purpose, shows proof, explains the method, and helps people begin.</desc>
