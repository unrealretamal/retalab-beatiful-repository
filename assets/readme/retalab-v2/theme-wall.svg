<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">One craft, many project-native directions</title><desc id="desc">Six distinct visual systems adapt README design to the material each project actually contains.</desc>
  <defs><pattern id="paper" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#10202A" stroke-opacity=".04"/></pattern></defs><rect width="1200" height="700" rx="26" fill="#F3F3EB"/><rect width="1200" height="700" rx="26" fill="url(#paper)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><text x="52" y="54" fill="#657779" font-size="14" font-weight="700" letter-spacing="2.4">THEME FOLLOWS THE PROJECT</text><text x="52" y="103" fill="#12212A" font-size="39" font-weight="780">Same craft. Six different visual languages.</text>
