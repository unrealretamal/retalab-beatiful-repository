<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">PostgreSQL README concept: show the shape of data</title><desc id="desc">An editorial database illustration connects accounts to projects and projects to events.</desc><rect width="1200" height="440" rx="26" fill="#E8EEF2"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><text x="52" y="52" fill="#2B6682" font-size="14" font-weight="750" letter-spacing="2">DATA / RELATIONAL STRUCTURE</text><text x="52" y="115" fill="#132A3A" font-size="44" font-weight="780">Put the relationships on the page.</text><text x="52" y="151" fill="#536C79" font-size="18">A conceptual schema gives unfamiliar table names useful context.</text><path d="M386 258h122m184 0h110M600 320v44h205v-43" fill="none" stroke="#367D95" stroke-width="3"/><circle cx="508" cy="258" r="5" fill="#FF765E"/><circle cx="702" cy="258" r="5" fill="#FF765E"/><circle cx="600" cy="320" r="5" fill="#FF765E"/><g><rect x="126" y="197" width="260" height="165" rx="12" fill="#fff" stroke="#AFC4CE"/><path d="M126 209a12 12 0 0 1 12-12h236a12 12 0 0 1 12 12v32H126z" fill="#153A4B"/><text x="149" y="226" fill="#F3F3EB" font-size="17" font-weight="700">accounts</text><text x="149" y="274" fill="#2F7085" font-family="ui-monospace,monospace" font-size="14">id</text><text x="226" y="274" fill="#50646D" font-size="14">uuid</text><path d="M148 289h216" stroke="#E0E8E9"/><text x="149" y="316" fill="#50646D" font-family="ui-monospace,monospace" font-size="14">name</text><text x="226" y="316" fill="#50646D" font-size="14">text</text></g><g><rect x="508" y="197" width="260" height="165" rx="12" fill="#fff" stroke="#AFC4CE"/><path d="M508 209a12 12 0 0 1 12-12h236a12 12 0 0 1 12 12v32H508z" fill="#24647A"/><text x="531" y="226" fill="#F3F3EB" font-size="17" font-weight="700">projects</text><text x="531" y="274" fill="#2F7085" font-family="ui-monospace,monospace" font-size="14">owner_id</text><text x="624" y="274" fill="#50646D" font-size="14">uuid</text><path d="M530 289h216" stroke="#E0E8E9"/><text x="531" y="316" fill="#50646D" font-family="ui-monospace,monospace" font-size="14">title</text><text x="624" y="316" fill="#50646D" font-size="14">text</text></g><g><rect x="805" y="197" width="260" height="165" rx="12" fill="#fff" stroke="#AFC4CE"/><path d="M805 209a12 12 0 0 1 12-12h236a12 12 0 0 1 12 12v32H805z" fill="#367D95"/><text x="828" y="226" fill="#F3F3EB" font-size="17" font-weight="700">events</text><text x="828" y="274" fill="#2F7085" font-family="ui-monospace,monospace" font-size="14">project_id</text><text x="928" y="274" fill="#50646D" font-size="14">uuid</text><path d="M827 289h216" stroke="#E0E8E9"/><text x="828" y="316" fill="#50646D" font-family="ui-monospace,monospace" font-size="14">created_at</text><text x="928" y="316" fill="#50646D" font-size="14">timestamp</text></g><text x="52" y="406" fill="#758991" font-family="ui-monospace,monospace" font-size="13">ILLUSTRATIVE SCHEMA · NOT A PRODUCT SCREENSHOT</text></g></svg>
