<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">Kubernetes README concept: make relationships visible</title><desc id="desc">A dark technical composition maps a request through a service to healthy pods on two nodes.</desc><rect width="1200" height="440" rx="26" fill="#111820"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><text x="52" y="52" fill="#82E7CD" font-size="14" font-weight="750" letter-spacing="2">SYSTEMS / CLUSTER MAP</text><text x="52" y="115" fill="#F3F3EB" font-size="44" font-weight="780">Show how the cluster connects.</text><text x="52" y="151" fill="#A7B8B7" font-size="18">A conceptual example: trace a request through the parts that serve it.</text><rect x="55" y="216" width="215" height="142" rx="15" fill="#1A2931" stroke="#39525A"/><text x="78" y="249" fill="#9BAFAD" font-size="13" font-weight="700" letter-spacing="1.4">ENTRY</text><rect x="79" y="272" width="168" height="54" rx="10" fill="#263B43"/><text x="163" y="306" text-anchor="middle" fill="#F3F3EB" font-size="19" font-weight="700">Ingress</text><path d="M270 299h84" stroke="#82E7CD" stroke-width="3"/><path d="m343 291 12 8-12 8" fill="none" stroke="#82E7CD" stroke-width="3"/><rect x="360" y="216" width="215" height="142" rx="15" fill="#1A2931" stroke="#39525A"/><text x="383" y="249" fill="#9BAFAD" font-size="13" font-weight="700" letter-spacing="1.4">ROUTING</text><rect x="384" y="272" width="168" height="54" rx="10" fill="#315C58"/><text x="468" y="306" text-anchor="middle" fill="#E9FFF5" font-size="19" font-weight="700">Service</text><path d="M575 299h78m0 0v-43m0 43v43m0-86h47m-47 86h47" fill="none" stroke="#82E7CD" stroke-width="3"/><rect x="704" y="207" width="420" height="160" rx="15" fill="#1A2931" stroke="#39525A"/><text x="728" y="239" fill="#9BAFAD" font-size="13" font-weight="700" letter-spacing="1.4">WORKLOAD / 2 NODES</text><g><rect x="728" y="257" width="170" height="81" rx="10" fill="#263B43"/><circle cx="750" cy="279" r="6" fill="#83F0CA"/><text x="766" y="284" fill="#F3F3EB" font-size="15" font-weight="700">Pod A</text><path d="M750 302h124" stroke="#547078" stroke-width="5" stroke-linecap="round"/><rect x="918" y="257" width="181" height="81" rx="10" fill="#263B43"/><circle cx="940" cy="279" r="6" fill="#83F0CA"/><text x="956" y="284" fill="#F3F3EB" font-size="15" font-weight="700">Pod B</text><path d="M940 302h131" stroke="#547078" stroke-width="5" stroke-linecap="round"/></g><text x="55" y="399" fill="#758C8E" font-family="ui-monospace,monospace" font-size="13">ILLUSTRATIVE DIAGRAM · NOT A DEPLOYMENT CLAIM</text></g></svg>
